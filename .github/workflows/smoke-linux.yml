name: smoke-linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke test (blank = latest release)"
        required: false
        default: ""
  release:
    types: [published]

jobs:
  fetch:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.dl.outputs.tag }}
      deb: ${{ steps.dl.outputs.deb }}
    steps:
      - name: Download the .deb from the release
        id: dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          [ -z "$tag" ] && tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Smoke testing release $tag"
          mkdir -p out
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir out
          deb=$(ls out/*.deb)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deb=$(basename "$deb")" >> "$GITHUB_OUTPUT"
          ls -la out
          sha256sum "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: out/*.deb
          if-no-files-found: error

  package:
    needs: fetch
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap the bare image
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates git

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: /tmp/deb

      - name: Install on a bare Ubuntu 24.04 with declared dependencies only
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          echo "::group::dpkg metadata"
          dpkg-deb --info "/tmp/deb/${{ needs.fetch.outputs.deb }}"
          echo "::endgroup::"
          apt-get install -y "/tmp/deb/${{ needs.fetch.outputs.deb }}"

      - name: Verify installed layout
        run: |
          set -euo pipefail
          dpkg -L cold-shot
          test -x /usr/bin/coldshot
          test -f /usr/share/applications/ColdShot.desktop
          test -f /usr/share/icons/hicolor/128x128/apps/coldshot.png

      - name: Check for shared libraries the package failed to declare
        run: |
          set -euo pipefail
          ldd /usr/bin/coldshot | tee /tmp/ldd.txt
          if grep -q "not found" /tmp/ldd.txt; then
            echo "::error::the .deb does not pull in every library the binary links against"
            grep "not found" /tmp/ldd.txt
            exit 1
          fi
          echo "every NEEDED library resolved from the declared Depends alone"

      - name: Launch headless in the bare container
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y xvfb dbus-x11 x11-utils xdotool imagemagick desktop-file-utils
          desktop-file-validate /usr/share/applications/ColdShot.desktop || true
          bash "$GITHUB_WORKSPACE/.github/scripts/launch-check.sh" || true
        continue-on-error: true

      - name: Remove cleanly
        run: |
          set -euo pipefail
          apt-get remove -y cold-shot
          test ! -e /usr/bin/coldshot
          echo "package removed cleanly"

  desktop:
    needs: fetch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: /tmp/deb

      - name: Install
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "/tmp/deb/${{ needs.fetch.outputs.deb }}"
          sudo apt-get install -y xvfb dbus-x11 x11-utils xdotool imagemagick desktop-file-utils
          dpkg -s cold-shot

      - name: Validate desktop entry
        run: desktop-file-validate /usr/share/applications/ColdShot.desktop || true

      - name: Launch and check the window appears
        run: bash .github/scripts/launch-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-evidence
          path: |
            /tmp/coldshot-smoke/*.log
            /tmp/coldshot-smoke/*.png
          if-no-files-found: warn
